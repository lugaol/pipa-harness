<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A kite flying in a blue sky with clouds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EC8F7"/>
      <stop offset="1" stop-color="#E8F6FF"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="700" cy="70" r="38" fill="#FFD75E"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="140" cy="90" rx="60" ry="24"/>
    <ellipse cx="190" cy="78" rx="46" ry="20"/>
    <ellipse cx="600" cy="300" rx="70" ry="26"/>
    <ellipse cx="660" cy="288" rx="48" ry="20"/>
    <ellipse cx="240" cy="330" rx="54" ry="20"/>
  </g>

  <!-- kite -->
  <g transform="translate(400 160) rotate(12)">
    <!-- diamond -->
    <polygon points="0,-90 70,0 0,110 -70,0" fill="#FF5A5F"/>
    <polygon points="0,-90 70,0 0,0" fill="#FF8A8E"/>
    <polygon points="0,-90 0,0 -70,0" fill="#FFB3B5"/>
    <!-- frame lines -->
    <line x1="0" y1="-90" x2="0" y2="110" stroke="#C73E43" stroke-width="3"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#C73E43" stroke-width="3"/>
    <!-- tail -->
    <path d="M0 110 q-20 40 5 70 q25 30 0 60" fill="none" stroke="#4A6B8A" stroke-width="3"/>
    <!-- tail bows -->
    <g fill="#FFD75E">
      <polygon points="0,150 -14,142 -10,160"/>
      <polygon points="0,150 14,142 10,160"/>
      <polygon points="4,205 -10,197 -6,215"/>
      <polygon points="4,205 18,197 14,215"/>
    </g>
  </g>

  <!-- string to ground -->
  <path d="M395 270 Q 340 340 300 395" fill="none" stroke="#4A6B8A" stroke-width="2" stroke-dasharray="6 5"/>
</svg>
