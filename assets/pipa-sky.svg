<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A pipa (Chinese lute) flying through a blue sky with clouds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EC8F7"/>
      <stop offset="1" stop-color="#E8F6FF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98A4B"/>
      <stop offset="1" stop-color="#8B5A2B"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="700" cy="70" r="38" fill="#FFD75E"/>
  <circle cx="700" cy="70" r="52" fill="#FFD75E" opacity="0.25"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="140" cy="90" rx="60" ry="24"/>
    <ellipse cx="190" cy="78" rx="46" ry="20"/>
    <ellipse cx="95" cy="80" rx="38" ry="16"/>
    <ellipse cx="620" cy="300" rx="70" ry="26"/>
    <ellipse cx="680" cy="288" rx="48" ry="20"/>
    <ellipse cx="560" cy="290" rx="40" ry="16"/>
    <ellipse cx="240" cy="330" rx="54" ry="20"/>
    <ellipse cx="290" cy="320" rx="38" ry="15"/>
  </g>

  <!-- birds -->
  <g stroke="#4A6B8A" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M120 180 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M640 160 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M520 90 q7 -7 14 0 q7 -7 14 0"/>
  </g>

  <!-- pipa, tilted as if flying -->
  <g transform="translate(400 210) rotate(-24)">
    <!-- neck -->
    <rect x="-14" y="-190" width="28" height="150" rx="8" fill="#6B4423"/>
    <!-- bent headstock -->
    <path d="M-14 -190 q-6 -34 22 -40 q22 -5 26 14 l-14 10 q-8 -10 -20 -6 q-10 4 -8 22 z" fill="#6B4423"/>
    <!-- tuning pegs -->
    <g fill="#4A2E15">
      <circle cx="-22" cy="-160" r="7"/>
      <circle cx="22" cy="-150" r="7"/>
      <circle cx="-22" cy="-125" r="7"/>
      <circle cx="22" cy="-115" r="7"/>
    </g>
    <!-- pear-shaped body -->
    <path d="M0 -60
             C 55 -55 80 10 70 70
             C 62 122 30 150 0 150
             C -30 150 -62 122 -70 70
             C -80 10 -55 -55 0 -60 Z" fill="url(#body)"/>
    <!-- sound hole / inlay -->
    <ellipse cx="0" cy="60" rx="16" ry="20" fill="#5A3A1A"/>
    <ellipse cx="0" cy="60" rx="16" ry="20" fill="none" stroke="#E8C98F" stroke-width="2"/>
    <!-- frets -->
    <g stroke="#E8C98F" stroke-width="3">
      <line x1="-14" y1="-160" x2="14" y2="-160"/>
      <line x1="-14" y1="-130" x2="14" y2="-130"/>
      <line x1="-14" y1="-100" x2="14" y2="-100"/>
      <line x1="-16" y1="-70" x2="16" y2="-70"/>
    </g>
    <!-- strings -->
    <g stroke="#F5E9D0" stroke-width="1.5">
      <line x1="-8" y1="-186" x2="-14" y2="130"/>
      <line x1="-3" y1="-186" x2="-5" y2="138"/>
      <line x1="3" y1="-186" x2="5" y2="138"/>
      <line x1="8" y1="-186" x2="14" y2="130"/>
    </g>
    <!-- bridge -->
    <rect x="-26" y="122" width="52" height="10" rx="4" fill="#4A2E15"/>
  </g>

  <!-- motion streaks -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="240" x2="210" y2="240"/>
    <line x1="150" y1="270" x2="220" y2="270"/>
    <line x1="100" y1="210" x2="170" y2="210"/>
  </g>
</svg>
