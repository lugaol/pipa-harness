model_list:
- model_name: primary
  litellm_params:
    model: stepfun/step-3.7-flash:free
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
- model_name: fast
  litellm_params:
    model: openai/qwen3:8b
    api_base: http://localhost:11434/v1
    api_key: ollama
- model_name: deep
  litellm_params:
    model: openai/gpt-oss:20b
    api_base: http://localhost:11434/v1
    api_key: ollama
- model_name: explore
  litellm_params:
    model: openai/qwen3:8b
    api_base: http://localhost:11434/v1
    api_key: ollama
litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 300
router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
  - primary:
    - deep
  - fast:
    - primary
  - deep:
    - primary
general_settings:
  master_key: sk-pipa-local
