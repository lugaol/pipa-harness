model_list:
- model_name: primary
  litellm_params:
    model: stepfun/step-3.7-flash:free
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
    custom_llm_provider: openai
- model_name: fast
  litellm_params:
    model: cohere/north-mini-code:free
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
    custom_llm_provider: openai
- model_name: deep
  litellm_params:
    model: kilo-auto/free
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
    custom_llm_provider: openai
- model_name: explore
  litellm_params:
    model: stepfun/step-3.7-flash:free
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
    custom_llm_provider: openai
- model_name: kilo-free
  litellm_params:
    model: stepfun/step-3.7-flash:free
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
    custom_llm_provider: openai
litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 300
router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
  - primary:
    - deep
  - fast:
    - primary
  - deep:
    - primary
general_settings:
  master_key: sk-pipa-local
