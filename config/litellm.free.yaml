model_list:
- model_name: primary
  litellm_params:
    model: openai/qwen2.5-coder:14b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
- model_name: fast
  litellm_params:
    model: openai/qwen2.5-coder:7b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
- model_name: deep
  litellm_params:
    model: openai/qwen2.5-coder:14b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
- model_name: explore
  litellm_params:
    model: openai/qwen2.5-coder:7b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
- model_name: kilo-free
  litellm_params:
    model: openai/qwen2.5-coder:7b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 300
  compress_tool_results: true
  compress_threshold_lines: 200
  context_budget: 0.5
  cache_prompt: true
  session_summaries: true
  cache_control:
    enabled: true
    provider: auto
router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
  - primary:
    - fast
  - fast:
    - primary
  - deep:
    - primary
general_settings:
  master_key: sk-pipa-local
