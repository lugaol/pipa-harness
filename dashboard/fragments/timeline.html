{% if rows %}
<div class="table-wrap">
  <table class="timeline">
    <thead>
      <tr><th scope="col">offset</th><th scope="col">event</th><th scope="col">detail</th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td class="mono nowrap">{{ r.offset }}</td>
        <td><span class="badge">{{ r.event }}</span></td>
        <td class="mono detail-cell">{{ r.detail }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
{% with message = empty_message | default('No events recorded for this session.') %}{% include "empty_state.html" %}{% endwith %}
{% endif %}
