tiers:
  jev:
    label: Jev
    description: "Fast structured decisions \u2014 routing, triage, classification.\
      \ Zero cost. 70ms latency."
    cost_ceiling_usd_per_1m: 0.0
    latency_target_ms: 100
    min_context: 4096
    max_steps: 1
    use_cases:
    - task_routing
    - bug_classification
    - feature_vs_bug
    - build_error_triage
    - confidence_scoring
    fallback: lowest
  lowest:
    label: Lowest
    description: "High-volume, tool-free first pass \u2014 triage, exploration, cheap\
      \ retries."
    cost_ceiling_usd_per_1m: 0.4
    latency_target_ms: 3000
    min_context: 16384
    max_steps: 4
  low:
    label: Low
    description: Scoped coding, search, quick verification runs.
    cost_ceiling_usd_per_1m: 0.4
    latency_target_ms: 5000
    min_context: 32768
    max_steps: 6
  mid:
    label: Mid
    description: "Default implementation tier \u2014 mechanical, multi-step work."
    cost_ceiling_usd_per_1m: 1.0
    latency_target_ms: 10000
    min_context: 65536
    max_steps: 10
  high:
    label: High
    description: "Strong planning and critique \u2014 specs, architecture, QA verdicts."
    cost_ceiling_usd_per_1m: 3.0
    latency_target_ms: 20000
    min_context: 131072
    max_steps: 16
  xhigh:
    label: X-High
    description: "Frontier tier \u2014 orchestrator and the hardest cross-cutting\
      \ design."
    cost_ceiling_usd_per_1m: 15.0
    latency_target_ms: 30000
    min_context: 200000
    max_steps: 24
  ? ''
  : max_steps: 1
agent_tiers:
  router: lowest
  orchestrator: mid
  dev: mid
  qa: low
  explorer: lowest
  analyst: high
  pm: high
  architect: high
  sm: mid
  researcher: high
