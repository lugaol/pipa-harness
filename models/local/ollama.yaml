# local/ollama.yaml — always-on fallback tier: local models via Ollama.
# Loaded unconditionally; cloud fragments override these aliases when their
# API keys are present (composer processes local/ first, then cloud/).
requires:
models:
- model_name: primary
  litellm_params:
    model: openai/qwen2.5-coder:14b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
- model_name: fast
  litellm_params:
    model: openai/qwen2.5-coder:7b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
- model_name: deep
  litellm_params:
    model: openai/qwen2.5-coder:14b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
- model_name: explore
  litellm_params:
    model: openai/qwen2.5-coder:7b
    api_base: http://localhost:11434/v1
    api_key: ollama
    custom_llm_provider: openai
