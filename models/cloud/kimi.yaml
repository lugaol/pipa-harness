# cloud/kimi.yaml — Moonshot Kimi coding tier (pay-as-you-go; ¥15 signup
# credits make it a cheap "deep" upgrade over local models).
requires: KIMI_API_KEY
models:
- model_name: deep
  litellm_params:
    model: openai/kimi-k2.7-code
    custom_llm_provider: openai
    api_base: https://api.moonshot.cn/v1
    api_key: os.environ/KIMI_API_KEY
- model_name: kimi-code
  litellm_params:
    model: openai/kimi-k2.7-code-highspeed
    custom_llm_provider: openai
    api_base: https://api.moonshot.cn/v1
    api_key: os.environ/KIMI_API_KEY
