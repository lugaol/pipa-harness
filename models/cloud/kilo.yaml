# cloud/kilo.yaml — Kilo gateway free tier (kilo-auto/free routes to a
# rotating free model; stepfun flash is the cheap workhorse).
requires: KILO_API_KEY
models:
- model_name: primary
  litellm_params:
    model: kilo-auto/free
    custom_llm_provider: openai
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
- model_name: fast
  litellm_params:
    model: stepfun/step-3.7-flash:free
    custom_llm_provider: openai
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
- model_name: explore
  litellm_params:
    model: stepfun/step-3.7-flash:free
    custom_llm_provider: openai
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
- model_name: kilo-free
  litellm_params:
    model: kilo-auto/free
    custom_llm_provider: openai
    api_base: https://api.kilo.ai/api/gateway
    api_key: os.environ/KILO_API_KEY
